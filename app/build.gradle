plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.aminpoker.game'
    compileSdk 35

    defaultConfig {
        applicationId 'com.aminpoker.game'
        minSdk 23
        targetSdk 34
        versionCode 7
        versionName '1.6'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}
